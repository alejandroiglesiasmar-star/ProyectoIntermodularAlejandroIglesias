# Configuración de la base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/db_salud_fitness?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# Configuración de Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Configuración de la IA (Groq API)
ai.api.key=${AI_API_KEY:demo_key}
ai.api.url=https://api.groq.com/openai/v1/chat/completions

# Configuración de vistas (opcional, para futuro uso Thymeleaf)
spring.mvc.view.prefix=/src/main/resources/templates/
spring.mvc.view.suffix=.html